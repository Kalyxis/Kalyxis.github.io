<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-label="Four surfaces: Editor, Console, Terminal and Files."><title>Four surfaces: Editor, Console, Terminal and Files.</title><style>.tw{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}
