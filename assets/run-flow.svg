<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Run pipeline: Run button, RunService and RunnerRegistry choose a Python, JavaScript or HTML runner and stream output to the Console."><title>Run pipeline: Run button, RunService and RunnerRegistry choose a Python, JavaScript or HTML runner and stream output to the Console.</title><style>.tw{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}
.blink{animation:blink 1.1s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.4s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(.88)}50%{transform:scale(1.2)}}
.float{animation:float 6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 48s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
