    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong colors.
      try {
        var s = JSON.parse(localStorage.getItem('kalyxis.settings.v1') || 'null')
        var t = s && s.theme
        var dark = t === 'dark' || ((t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches) || !t
        var theme = t === 'light' ? 'light' : dark ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', theme === 'dark' ? '#08090c' : '#f4f2ec')
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #08090c; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f4f2ec; }
      #boot { position: fixed; inset: 0; z-index: 0; display: grid; place-items: center; }
      #boot svg { width: 64px; height: 64px; color: #cdd3d8; opacity: 0.9; animation: boot-pulse 1.6s ease-in-out infinite; }
      html[data-theme='light'] #boot svg { color: #1d232a; }
      @keyframes boot-pulse { 50% { opacity: 0.35; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none">

        <circle cx="50" cy="50" r="33" stroke="currentColor" stroke-width="1" opacity="0.4" />

    </div>
    <div id="root"></div>
    <noscript>Kalyxis needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
